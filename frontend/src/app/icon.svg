<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient: Deep Obsidian to Cyber Pine -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D15"/>
      <stop offset="50%" stop-color="#051711"/>
      <stop offset="100%" stop-color="#021C14"/>
    </linearGradient>

    <!-- Border Accent Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#059669" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Left Blade: Vibrant Mint to Emerald Gradient -->
    <linearGradient id="leftBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Right Blade: Radiant Teal to Deep Jade Gradient -->
    <linearGradient id="rightBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#024E39"/>
    </linearGradient>

    <!-- Database Disc Platter -->
    <linearGradient id="dbDisc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Ambient Center Glow Filter -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Dark Obsidian Squircle Shell with Emerald Border -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>
  <rect x="26" y="26" width="460" height="460" rx="110" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.3"/>

  <!-- 2. Ambient Emerald Core Glow -->
  <circle cx="256" cy="245" r="110" fill="#10B981" fill-opacity="0.16" filter="url(#ambientGlow)"/>

  <!-- 3. PostgreSQL Database Platters / PostGIS Geodesic Rings -->
  <!-- Lower Arc -->
  <path d="M 136 390 C 136 418, 376 418, 376 390" fill="none" stroke="#10B981" stroke-width="7" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- Upper Platter Ring -->
  <ellipse cx="256" cy="365" rx="116" ry="24" fill="none" stroke="url(#dbDisc)" stroke-width="8"/>

  <!-- 4. Left Leaf Blade (Soaring organic geometry) -->
  <path d="M 256 86 C 256 86, 118 152, 126 286 C 132 352, 204 380, 256 388 C 248 296, 248 190, 256 86 Z" fill="url(#leftBlade)"/>

  <!-- 5. Right Leaf Blade (Contrasting deep spatial tone) -->
  <path d="M 256 86 C 256 86, 394 152, 386 286 C 380 352, 308 380, 256 388 C 264 296, 264 190, 256 86 Z" fill="url(#rightBlade)"/>

  <!-- 6. Razor-Sharp Neural Stem & Vector Axis -->
  <line x1="256" y1="96" x2="256" y2="400" stroke="#ECFDF5" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="96" x2="256" y2="400" stroke="#34D399" stroke-width="14" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- 7. Spatial Vector Hub (Centroid Core Node) -->
  <circle cx="256" cy="235" r="28" stroke="#34D399" stroke-width="4" stroke-opacity="0.8" fill="none"/>
  <circle cx="256" cy="235" r="20" stroke="#6EE7B7" stroke-width="3" stroke-opacity="0.9" fill="none"/>
  <circle cx="256" cy="235" r="12" fill="#FFFFFF"/>

  <!-- 8. Orbital Vector Satellites & Ray Links -->
  <line x1="190" y1="270" x2="256" y2="235" stroke="#6EE7B7" stroke-width="3" stroke-opacity="0.6" stroke-dasharray="6 4"/>
  <line x1="322" y1="270" x2="256" y2="235" stroke="#6EE7B7" stroke-width="3" stroke-opacity="0.6" stroke-dasharray="6 4"/>
  <circle cx="190" cy="270" r="7" fill="#6EE7B7"/>
  <circle cx="322" cy="270" r="7" fill="#6EE7B7"/>
</svg>

